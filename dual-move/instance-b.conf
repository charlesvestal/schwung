<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Per-instance D-Bus bus for the second MoveOriginal.
       Run with: dbus-daemon --config-file=this --fork --print-address
       Then launch MoveOriginal with:
         DBUS_SYSTEM_BUS_ADDRESS=unix:abstract=move-b-bus /opt/move/MoveOriginal
       Tested 2026-04-27 — instance B successfully registers all 8
       com.ableton.move.* services on this bus. -->
  <type>system</type>
  <listen>unix:abstract=move-b-bus</listen>
  <auth>EXTERNAL</auth>
  <allow_anonymous/>
  <pidfile>/data/UserData/schwung/dual-move/dbus-b.pid</pidfile>
  <policy context="default">
    <allow user="*"/>
    <allow own="*"/>
    <allow send_destination="*" send_interface="*"/>
    <allow receive_sender="*" receive_interface="*"/>
  </policy>
</busconfig>
