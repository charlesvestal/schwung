name: CI

# Fork-safe by construction:
#   - `pull_request` runs in the PR AUTHOR's context (read-only token, no
#     repository secrets injected, workflow changes need maintainer approval).
#   - This is the SAFE trigger for untrusted code. Never switch this to
#     `pull_request_target` — that runs in the base repo's context with full
#     write token + secrets.
#   - `permissions:` is pinned to the minimum; do not raise it.
#   - TODO(hardening): pin third-party actions to commit SHAs once finalized.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Cancel superseded runs on the same ref (saves minutes on force-pushes).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------- host-tests
  # Fast, device-free unit + contract/invariant tests. Runs natively on the
  # runner (no cross-compile, no Move hardware). Validated locally: 37/37 .sh
  # tests pass + the MPSC lock-free stress test passes.
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: C unit tests (MPSC writer, etc.)
        run: make -C tests/host test
      - name: Contract / invariant / native-compile tests
        run: |
          set -e
          for t in tests/host/*.sh; do
            echo "== $t"
            bash "$t"
          done

  # ------------------------------------------------------------- sanitizers
  # The deferred module loader (src/modules/chain/dsp/chain_loader.c) is the
  # one place in this tree where two threads touch the same memory, and one of
  # them is the SPI audio callback. It is lock-free by design — the SPI side
  # takes no mutex, because an RT thread blocking on a lock held by a
  # SCHED_OTHER thread is unbounded priority inversion — so nothing but a race
  # detector will tell us when that reasoning stops being true.
  #
  # This job exists because the sanitizers are NOT usable on the maintainer's
  # machine: a six-line pthread program hangs under ASan and segfaults under
  # TSan there, so a local run says nothing either way. Linux CI is the only
  # place these currently produce a trustworthy answer.
  #
  # Deliberately NOT a required check while it beds in — read it, don't gate
  # on it, until it has been green for a while.
  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ThreadSanitizer — races in the loader handshake
        run: |
          set -e
          mkdir -p build/tests
          cc -std=gnu11 -g -O1 -fsanitize=thread \
            -Wall -Wno-unused-parameter -Wno-unused-function \
            -Isrc -Isrc/modules/chain/dsp -Isrc/host \
            tests/host/test_chain_deferred_load.c \
            src/modules/chain/dsp/chain_loader.c \
            -o build/tests/tsan_deferred_load -lpthread
          TSAN_OPTIONS="halt_on_error=1" ./build/tests/tsan_deferred_load
      - name: AddressSanitizer — use-after-free across the handoff
        run: |
          set -e
          cc -std=gnu11 -g -O1 -fsanitize=address,undefined \
            -fno-omit-frame-pointer \
            -Wall -Wno-unused-parameter -Wno-unused-function \
            -Isrc -Isrc/modules/chain/dsp -Isrc/host \
            tests/host/test_chain_deferred_load.c \
            src/modules/chain/dsp/chain_loader.c \
            -o build/tests/asan_deferred_load -lpthread
          ASAN_OPTIONS="detect_leaks=1:halt_on_error=1" ./build/tests/asan_deferred_load

  # ----------------------------------------------------------------------- go
  # schwung-manager (on-device module store / updater service).
  # NOTE: go.mod declares `go 1.26`. Keep this pin >= 1.26 or the build breaks.
  go:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: schwung-manager } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.26' }
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./...

  # ---------------------------------------------------------- cross-compile
  # Proves the application COMPILES for ARM64. Reuses the exact Docker build
  # path that release.yml runs on every tag, then asserts every expected
  # artifact exists and is ELF/ARM-aarch64. build.sh runs under `set -e` with
  # no compile step masked, so the first compiler error fails this job.
  cross-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive, fetch-depth: 0 }
      - uses: docker/setup-buildx-action@v3
      - name: Build (same path as release.yml)
        run: |
          docker build -t schwung-builder .
          docker run --rm -v "$PWD:/build" schwung-builder
      - name: Verify all targets compiled (ARM aarch64)
        run: |
          set -e
          # Core set: always built, no conditional external deps.
          for f in \
            build/schwung \
            build/schwung-shim.so \
            build/display-server \
            build/modules/chain/dsp.so \
            build/modules/audio_fx/freeverb/freeverb.so \
            build/modules/midi_fx/chord/dsp.so \
            build/modules/midi_fx/arp/dsp.so \
            build/modules/midi_fx/velocity_scale/dsp.so \
            build/modules/sound_generators/linein/dsp.so \
            build/modules/tools/wav-player/dsp.so \
            build/bin/display_ctl \
            build/bin/jack_midi_connect \
            build/lib/jack/jack_shadow.so ; do
            printf '%-48s ' "$f"
            test -f "$f" || { echo "MISSING"; exit 1; }
            file "$f" | grep -q 'aarch64' || { echo "WRONG ARCH"; file "$f"; exit 1; }
            echo "ok"
          done
          # link-subscriber is the SOLE reception path for Move->Schwung
          # audio, and this check used to be a warning:
          #     ... || { echo "WARN: link-subscriber not built"; }
          # It is not conditional here — `submodules: recursive` above
          # guarantees libs/link — so a warning could only ever mean the build
          # silently stopped producing it, which is exactly what happened.
          # On a dev machine with an uninitialised submodule, build.sh printed
          # "Warning: Link SDK not found ... skipping link-subscriber", exited
          # 0, package.sh omitted it, and install.sh only ever KILLS it. The
          # sidecar on the test device went unreplaced for weeks and rode
          # through a three-version bisect as the one thing nobody varied.
          # A soft check on the one file that can rot invisibly is no check.
          printf '%-48s ' build/link-subscriber
          test -f build/link-subscriber || { echo "MISSING"; exit 1; }
          file build/link-subscriber | grep -q 'aarch64' || \
            { echo "WRONG ARCH"; file build/link-subscriber; exit 1; }
          echo "ok"
      - name: Verify packaged tarball
        run: |
          test -f schwung.tar.gz
          tar -tzf schwung.tar.gz | grep -q 'schwung$'
          # package.sh adds the sidecar only "if it was built", so the tarball
          # is where a silent skip actually reaches users.
          tar -tzf schwung.tar.gz | grep -q 'schwung/link-subscriber$' || {
            echo "tarball has no link-subscriber — Move->Schwung audio would be dead"; exit 1; }
